services:
  dashboard:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/dashboard.db
    networks:
      - internal

volumes:
  db-data:
    name: drugans-dashboard-db

networks:
  internal:
